groups:
  - name: InventorySystemAlerts
    rules:
      # Alto consumo CPU
      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alto consumo de CPU detectado en {{ $labels.instance }}"
          description: "La CPU ha estado por encima del 80% durante más de 2 minutos."

      # Error rate elevado (Códigos 5xx)
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) / sum(rate(http_server_requests_seconds_count[1m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de errores 5xx elevada en {{ $labels.instance }}"
          description: "Más del 5% de las peticiones HTTP están fallando con códigos 5xx."

      # Latencia alta (Mayor a 1 segundo)
      - alert: HighLatency
        expr: sum(rate(http_server_requests_seconds_sum[1m])) / sum(rate(http_server_requests_seconds_count[1m])) > 1.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latencia alta detectada en {{ $labels.instance }}"
          description: "La latencia promedio superó 1 segundo en el último minuto."

      # Servicios caídos (Instancias down)
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servicio caído: {{ $labels.job }}"
          description: "El servicio {{ $labels.job }} no responde desde hace 1 minuto."

      # Fallos de autenticación
      - alert: AuthenticationFailures
        expr: rate(spring_security_authentications_total{result="failure"}[1m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Múltiples fallos de autenticación detectados"
          description: "Se detectaron más de 5 fallos de autenticación por minuto."
