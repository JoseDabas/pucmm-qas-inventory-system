# Reglas de alerta provisionadas (Grafana unified alerting).
# Todas consultan el datasource Prometheus por su uid fijo "prometheus".
# Visibles en la UI de Grafana (Alerting); usan la política de notificación por defecto.
apiVersion: 1

groups:
  - orgId: 1
    name: inventory-alerts
    folder: Inventory Alerts
    interval: 1m
    rules:
      # 1. Alto consumo de CPU en el host (node-exporter)
      - uid: inv-cpu-high
        title: Alto consumo de CPU (host)
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [85] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, area: infraestructura }
        annotations:
          summary: CPU del host por encima de 85% durante 5m

      # 2. Error rate elevado (respuestas 5xx del backend)
      - uid: inv-error-rate
        title: Error rate elevado (5xx)
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.0001)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
        noDataState: OK
        execErrState: Error
        labels: { severity: critical, area: aplicacion }
        annotations:
          summary: Más del 5% de respuestas 5xx durante 5m

      # 3. Latencia alta (latencia media de peticiones HTTP)
      - uid: inv-latency-high
        title: Latencia alta
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum(rate(http_server_requests_seconds_sum[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.0001)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, area: aplicacion }
        annotations:
          summary: Latencia media de peticiones por encima de 1s durante 5m

      # 4. Servicios caídos (backend o node-exporter sin responder)
      - uid: inv-service-down
        title: Servicio caído
        condition: C
        for: 1m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: up{job=~"inventory-backend|node-exporter"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical, area: infraestructura }
        annotations:
          summary: Un target monitorizado (backend/node-exporter) está caído (up=0)

      # 5. Fallos de autenticación (picos de 401/403)
      - uid: inv-auth-failures
        title: Fallos de autenticación elevados
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum(rate(http_server_requests_seconds_count{status=~"401|403"}[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.2] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, area: seguridad }
        annotations:
          summary: Tasa de respuestas 401/403 por encima del umbral durante 5m
