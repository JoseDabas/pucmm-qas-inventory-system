apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    uid: loki

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    uid: tempo
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        tags:
          - key: 'service.name'
            dir: 'app'
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: 'service.name'
            value: 'service'
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{service="$__tags"}[5m]))'
          - name: Error rate
            query: 'sum(rate(traces_spanmetrics_calls_total{service="$__tags",status_code="STATUS_CODE_ERROR"}[5m]))'
